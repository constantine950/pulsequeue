services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: pulsequeue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pulsequeue}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pulsequeue-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API server
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: pulsequeue-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pulsequeue}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: pulsequeue-worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pulsequeue}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app/backend
    depends_on:
      api:
        condition: service_healthy

  #  Scheduler
  scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: pulsequeue-scheduler
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pulsequeue}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app/backend
    command: python -m backend.core.scheduler.scheduler
    depends_on:
      api:
        condition: service_healthy

  # Dashboard
  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    container_name: pulsequeue-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
